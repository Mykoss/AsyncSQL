name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile and run tests
        run: gradle clean build publishToMavenLocal --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: asyncsql-jars
          path: build/libs/*.jar
